spring.application.name=xcopybackend
spring.datasource.url=jdbc:postgresql://postgres:5432/${PSQL_NAME}
spring.datasource.username=${PSQL_USER}
spring.datasource.password=${PSQL_PASSWORD}

spring.mongodb.uri=${MONGODB_URI}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=30s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=xcopy:

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

org.gradle.configuration-cache=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Files are persisted locally and exposed at /media/posts/{file-name}.
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads/posts}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
