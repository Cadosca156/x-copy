services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: xcopy_e2e
      POSTGRES_USER: xcopy_e2e
      POSTGRES_PASSWORD: e2e-only-password
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcopy_e2e -d xcopy_e2e"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1})"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
